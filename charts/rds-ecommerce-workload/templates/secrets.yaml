{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: rds-db-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rds-ecommerce-workload
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DB_WRITE_HOST: {{ .Values.database.writeHost | quote }}
  DB_READ_HOST: {{ .Values.database.readHost | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  DATA_SOURCE_NAME: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.writeHost }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
{{- end }}

