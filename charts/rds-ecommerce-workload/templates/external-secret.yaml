{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rds-ecommerce-workload
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name | default "external-secrets-sa" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-db-credentials-sync
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: rds-ecommerce-workload
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: rds-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_WRITE_HOST: {{ .Values.database.writeHost | quote }}
        DB_READ_HOST: "{{`{{ .reader_host }}`}}"
        DB_PORT: "{{`{{ .port }}`}}"
        DB_NAME: "{{`{{ .database }}`}}"
        DB_USER: "{{`{{ .username }}`}}"
        DB_PASSWORD: "{{`{{ .password }}`}}"
        DATA_SOURCE_NAME: "postgresql://{{`{{ .username }}`}}:{{`{{ .password }}`}}@{{ .Values.database.writeHost }}:{{`{{ .port }}`}}/{{`{{ .database }}`}}?sslmode=require"
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.secretName }}
{{- end }}
