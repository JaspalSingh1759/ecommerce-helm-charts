{{- if .Values.orderService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: order-inventory-service
  namespace: {{ .Values.namespace }}
  labels:
    app: order-inventory-service
    app.kubernetes.io/name: order-inventory-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.orderService.service.type }}
  ports:
    - port: {{ .Values.orderService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: order-inventory-service
{{- end }}
