# ------------------------------------------------------------------------------
# Global & Common Settings
# ------------------------------------------------------------------------------
environment: dev
namespace: apps

# ------------------------------------------------------------------------------
# External Secrets Operator (AWS Secrets Manager Sync)
# ------------------------------------------------------------------------------
externalSecrets:
  enabled: true
  region: "us-east-1"
  secretName: "microservices-demo-dev-pg-cluster-credentials"
  refreshInterval: "1h"
  serviceAccount:
    name: "external-secrets-sa"

# ------------------------------------------------------------------------------
# Database Connectivity Configuration (RDS Multi-AZ & Proxy)
# ------------------------------------------------------------------------------
database:
  # Connection endpoints
  writeHost: "microservices-demo-dev-pg-cluster-proxy.proxy-ce56648m2ubr.us-east-1.rds.amazonaws.com"
  readHost: "microservices-demo-dev-pg-cluster.cluster-ro-ce56648m2ubr.us-east-1.rds.amazonaws.com"
  port: 5432
  name: "ecommerce_orders"
  user: "dbadmin"
  password: ""  # Dynamically synced from AWS Secrets Manager via External Secrets Operator
  
  # Connection Pool Optimization
  pool:
    min: 5
    max: 25
    timeoutSec: 10.0


# ------------------------------------------------------------------------------
# Order & Inventory Microservice Deployment
# ------------------------------------------------------------------------------
orderService:
  enabled: true
  replicas: 3
  image:
    repository: jaspsing369/orderinventoryservice
    tag: latest
    pullPolicy: Always

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  service:
    type: ClusterIP
    port: 8080

  podDisruptionBudget:
    minAvailable: 2

# ------------------------------------------------------------------------------
# Prometheus PostgreSQL Exporter Deployment
# ------------------------------------------------------------------------------
postgresExporter:
  enabled: true
  image:
    repository: prometheuscommunity/postgres-exporter
    tag: v0.15.0
    pullPolicy: IfNotPresent
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  service:
    type: ClusterIP
    port: 9187

# ------------------------------------------------------------------------------
# Locust Load & Traffic Generator Deployment
# ------------------------------------------------------------------------------
locust:
  enabled: true
  replicas: 1
  image:
    repository: locustio/locust
    tag: 2.29.0
    pullPolicy: IfNotPresent

  targetHost: "http://order-inventory-service:8080"
  users: 50
  spawnRate: 5

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
